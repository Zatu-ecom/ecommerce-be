# VM-1 (data) — Postgres + durable Redis (KV). No app services here.
# Layout on VM: ~/ecommerce-data/{docker-compose.yml,.env,migrations/,seeds/}
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    # 1 GB Micro tuning (spec 014 FR5)
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=256MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
    # Bound to the PRIVATE IP only: the public interface never listens on 5432,
    # even if firewalld / the OCI security list is misconfigured (defence in depth).
    # Override with BIND_IP in .env if the VM's private IP ever changes.
    ports:
      - "${BIND_IP:-10.0.0.208}:5432:5432"
    # Ceiling so a runaway backend cannot starve the host (1 GB box).
    mem_limit: 320m
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Durable KV role: scheduler queue, idempotency, denylist, limiter.
  # noeviction + snapshots - pressure must fail loud, never drop jobs.
  cache-durable:
    image: redis:7-alpine
    container_name: ecommerce-cache-durable
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
      --requirepass ${CACHE_PASSWORD}
      --maxmemory ${KV_MAXMEMORY:-128mb}
      --maxmemory-policy noeviction
      --save "900 1 300 10"
      --appendonly yes
      --appendfsync everysec
    ports:
      - "${BIND_IP:-10.0.0.208}:6381:6379"
    mem_limit: 144m
    volumes:
      - kv_data:/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${CACHE_PASSWORD}\" ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      # Only used by the healthcheck above; redis itself reads --requirepass.
      CACHE_PASSWORD: ${CACHE_PASSWORD}

  # Migration runner (tools profile). Uses --production = migrations + CORE
  # seeds only; the repo default --all would also load dev mock data.
  migrate:
    image: postgres:16-alpine
    container_name: ecommerce-migrate
    logging: *default-logging
    env_file:
      - .env
    volumes:
      # Read-only: the runner only reads SQL (chmod +x is done on the host copy).
      - .:/app:ro
    working_dir: /app
    networks:
      - ecommerce-network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        cd migrations &&
        ./run_migrations.sh --production
      "
    profiles:
      - tools

networks:
  ecommerce-network:
    driver: bridge
    name: ecommerce-network

volumes:
  postgres_data:
    name: ecommerce-postgres-data
  kv_data:
    name: ecommerce-kv-data
