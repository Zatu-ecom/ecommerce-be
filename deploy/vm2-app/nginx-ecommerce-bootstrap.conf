# BOOTSTRAP config — HTTP only. Use this until the certificate exists, then
# switch to nginx-ecommerce.conf (which adds the 443 server block).
#
# Installed on VM-2 as ~/ecommerce-app/nginx-ecommerce.conf (bind-mounted into
# the nginx container as /etc/nginx/conf.d/default.conf).
server {
    listen 80;
    server_name api.dev.ecom.vitrapay.io;

    server_tokens off;
    client_max_body_size 100m;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Let's Encrypt HTTP-01 challenge (certbot writes into ./certbot/www).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
