# Installed on VM-2 as ~/ecommerce-app/nginx-ecommerce.conf, bind-mounted into
# the nginx container as /etc/nginx/conf.d/default.conf.
# IP-only phase: server_name _ (matches any Host). At domain time:
#   1) replace _ with api.<domain>  2) run certbot container with webroot
#   3) certbot rewrites this file to TLS automatically
server {
    listen 80;
    server_name _;

    # File uploads flow through the API (specs 003/004)
    client_max_body_size 100m;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;

    location / {
        # app is the compose service name on the shared ecommerce-network.
        # 127.0.0.1 would be the nginx container itself, not the Go app.
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
