# TLS config — HTTP + HTTPS. Use only AFTER the certificate exists
# (nginx fails to start if the cert files are missing). See deploy/vm2-app/TLS.md.
#
# Installed on VM-2 as ~/ecommerce-app/nginx-ecommerce.conf (bind-mounted into
# the nginx container as /etc/nginx/conf.d/default.conf).
server {
    listen 80;
    server_name api.dev.ecom.vitrapay.io;

    server_tokens off;
    client_max_body_size 100m;

    # Keep the challenge path alive so renewals work without downtime.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # TLS is live and 443 is open at the OCI security list, so plaintext
        # requests are redirected. The ACME location above still answers over
        # HTTP so certificate renewals keep working.
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.dev.ecom.vitrapay.io;

    ssl_certificate     /etc/letsencrypt/live/api.dev.ecom.vitrapay.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dev.ecom.vitrapay.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 100m;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Enable HSTS only once HTTPS is permanent for this host.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
