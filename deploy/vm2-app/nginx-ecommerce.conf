# Installed on VM-2 as ~/ecommerce-app/nginx-ecommerce.conf, bind-mounted into
# the nginx container as /etc/nginx/conf.d/default.conf.
# IP-only phase: server_name _ (matches any Host). At domain time:
#   1) replace _ with api.<domain>  2) run certbot container with webroot
#   3) add the TLS server block / reload
server {
    listen 80;
    server_name _;

    # Don't advertise the nginx version.
    server_tokens off;

    # File uploads flow through the API (specs 003/004)
    client_max_body_size 100m;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;

    # Conservative defaults for an API edge.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        # app is the compose service name on the shared ecommerce-network.
        # 127.0.0.1 would be the nginx container itself, not the Go app.
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        # Empty Connection header enables upstream keepalive; without it every
        # request opens a new TCP connection to the app.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
