name: Deploy backend (Oracle) - deploys the branch selected above

# Manual only — no push trigger. Choose the branch with "Use workflow from",
# pick the environment, press Run.
# The image is built on the runner and shipped to VM-2 over SSH; no registry is
# involved. See deploy/GITHUB-DEPLOY.md for the required secrets.
run-name: Deploy ${{ github.ref_name }} to ${{ inputs.target_env }}

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Config environment
        required: true
        type: choice
        options:
          - dev
      run_migrations:
        description: Run DB migrations BEFORE switching the app (schema + CORE seeds; never mock data)
        required: true
        type: boolean
        default: false
      image_tag:
        description: Optional tag override (letters, digits, dot, dash, underscore)
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-oracle-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Optional gate: attach reviewers/protection to this environment in GitHub.
    environment: ${{ inputs.target_env }}
    env:
      VM2_HOST: ${{ vars.VM2_HOST }}   # e.g. 130.210.26.64
      VM1_HOST: ${{ vars.VM1_HOST }}   # e.g. 140.238.240.2
    steps:
      - name: Checkout application
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # No `ref`: checkout uses the branch/tag picked in "Use workflow from".

      - name: Checkout Config repo
        id: config
        uses: actions/checkout@v7
        with:
          repository: Zatu-ecom/Config
          ssh-key: ${{ secrets.CONFIG_DEPLOY_KEY }}
          path: config
          persist-credentials: false

      - name: Record Config revision
        id: config_sha
        run: echo "sha=$(git -C config rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate and render .env from Config + secrets
        env:
          TARGET_ENV: ${{ inputs.target_env }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          CACHE_PASSWORD: ${{ secrets.CACHE_PASSWORD }}
          KV_PASSWORD: ${{ secrets.KV_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          set -euo pipefail
          config/scripts/validate.sh "$TARGET_ENV"
          # Render outside the checkout so secrets never sit in the workspace.
          config/scripts/render-backend-env.sh "$TARGET_ENV" "$RUNNER_TEMP/app.env"

      - name: Compute image tag
        id: tag
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          tag="${IMAGE_TAG_INPUT:-}"
          if [ -z "$tag" ]; then
            tag="$(printf '%s' "${GITHUB_REF_NAME}" | tr '/' '-')-$(git rev-parse --short HEAD)"
          fi
          case "$tag" in
            *[!A-Za-z0-9._-]*|'') echo "invalid image tag: '$tag' (allowed: A-Z a-z 0-9 . _ -)" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using tag: $tag"

      - uses: docker/setup-buildx-action@v4

      - name: Build image (linux/amd64, loaded into the local daemon)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ecommerce-backend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run DB migrations (before the app switch)
        if: ${{ inputs.run_migrations }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/mig && chmod 600 ~/.ssh/mig
          ssh -i ~/.ssh/mig -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "opc@${VM1_HOST}" \
            "cd ~/ecommerce-data && docker compose --profile tools run --rm migrate"

      - name: Deploy to VM-2
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TAG: ${{ steps.tag.outputs.tag }}
          CONFIG_SHA: ${{ steps.config_sha.outputs.sha }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          TARGET_ENV: ${{ inputs.target_env }}
        run: |
          set -euo pipefail
          echo "App revision: $GITHUB_SHA"
          echo "Config revision: $CONFIG_SHA"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          SSH_OPTS=(-i "$HOME/.ssh/deploy" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          SSH=(ssh "${SSH_OPTS[@]}" "opc@${VM2_HOST}")
          SCP=(scp "${SSH_OPTS[@]}")

          # 1) Ship the image FIRST (no registry). Nothing on the host changes
          #    unless this succeeds. ~25-30 MB compressed.
          docker save "ecommerce-backend:${TAG}" | gzip | "${SSH[@]}" 'gunzip | docker load'

          # 2) Write the rendered .env with 600 perms from the first byte.
          "${SSH[@]}" 'umask 077; cat > ~/ecommerce-app/.env' < "$RUNNER_TEMP/app.env"

          # 3) Retag + start, and FAIL the job if the app never becomes healthy.
          "${SSH[@]}" "set -euo pipefail; cd ~/ecommerce-app;
                docker image tag ecommerce-backend:latest ecommerce-backend:previous 2>/dev/null || true;
                docker tag ecommerce-backend:${TAG} ecommerce-backend:latest;
                IMAGE_TAG=${TAG} docker compose up -d --wait --wait-timeout 90 app;
                docker compose ps app"

          # 4) Record the deploy only after it is healthy.
          cat > deploy-info.json <<EOF
          {"tag":"${TAG}","config_sha":"${CONFIG_SHA}","actor":"${ACTOR}","ref":"${REF_NAME}","env":"${TARGET_ENV}","deployed_at":"$(date -u +%FT%TZ)"}
          EOF
          "${SCP[@]}" deploy-info.json "opc@${VM2_HOST}:~/ecommerce-app/deploy-info.json"

      - name: Summary
        run: |
          echo "Deployed ecommerce-backend:${{ steps.tag.outputs.tag }} to ${{ inputs.target_env }} (shipped over SSH)"
          echo "Rollback: on VM-2 run  IMAGE_TAG=previous docker compose up -d app"
