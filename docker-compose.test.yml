# Test-only backends for TEST_USE_EXTERNAL=1 (test infra only, never production).
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   TEST_USE_EXTERNAL=1 make test
#   docker compose -f docker-compose.test.yml down
#
# Ports intentionally differ from docker-compose.yml (dev: 5432/6380/6381)
# so test and dev backends can run side by side. Tests reset state
# (TRUNCATE ... CASCADE + FLUSHALL) on every acquire, so no manual cleanup
# is needed between runs.
services:
  test-postgres:
    image: postgres:16-alpine
    container_name: ecommerce-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_test
    ports:
      - "5433:5432"
    networks:
      - ecommerce-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-cache:
    image: redis:7-alpine
    container_name: ecommerce-test-cache
    command: redis-server --save "" --appendonly no
    ports:
      - "6382:6379"
    networks:
      - ecommerce-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-durable:
    image: redis:7-alpine
    container_name: ecommerce-test-durable
    command: redis-server --save "" --appendonly no
    ports:
      - "6383:6379"
    networks:
      - ecommerce-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  ecommerce-test-network:
    driver: bridge
    name: ecommerce-test-network
